<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | WIZ Beauty Salon</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: dark;
        --plum: #2a0a20;
        --blush: #f3c6d4;
        --blush-soft: #e7a7bd;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(120% 90% at 12% 0%, #4a1233 0%, transparent 58%),
          radial-gradient(100% 80% at 90% 10%, #5d1a3f 0%, transparent 52%),
          var(--plum);
        color: #fdf6f8;
        font-family: "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 34rem;
      }
      p.eyebrow {
        margin: 0 0 1rem;
        font-size: 0.7rem;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        color: var(--blush-soft);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.4rem, 8vw, 3.6rem);
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      h1 em {
        font-family: Georgia, "Times New Roman", serif;
        color: var(--blush);
      }
      p.copy {
        margin: 0 auto 2rem;
        max-width: 26rem;
        font-size: 0.95rem;
        line-height: 1.75;
        color: rgb(253 246 248 / 0.78);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        border: 1px solid rgb(243 198 212 / 0.42);
        color: #fdf6f8;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        transition:
          background 0.25s ease,
          border-color 0.25s ease;
      }
      a:hover,
      a:focus-visible {
        background: rgb(243 198 212 / 0.14);
        border-color: var(--blush);
        outline: none;
      }
      a.primary {
        background: var(--blush);
        border-color: var(--blush);
        color: #2a0a20;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">WIZ Beauty Salon</p>
      <h1>This page has <em>wandered off.</em></h1>
      <p class="copy">
        The address you followed is not here any more. The salon is still open, and the booking page
        still works — start again from one of these.
      </p>
      <nav>
        <a class="primary" href="/">Home</a>
        <a href="/booking">Book an appointment</a>
        <a href="/services">Services</a>
        <a href="/contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
