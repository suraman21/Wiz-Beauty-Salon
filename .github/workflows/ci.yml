name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # React site: lint, typecheck, test, build
  # ---------------------------------------------------------------------
  site:
    name: Site — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: .output/public
          retention-days: 7

  # ---------------------------------------------------------------------
  # PHP admin: syntax, static analysis, tests, dependency audit
  # ---------------------------------------------------------------------
  admin:
    name: Admin — syntax, PHPStan, PHPUnit, migrations, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      # The app reads configuration from .env; in CI the same values arrive as
      # process environment variables, which Env::get() falls back to.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: wiz_test
      DB_USER: wiz
      DB_PASS: wiz

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wiz_test
          MARIADB_USER: wiz
          MARIADB_PASSWORD: wiz
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, mbstring, sodium, fileinfo, intl, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Syntax check
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Generate an application key
        # Signs the links customers use to change a booking. CI only needs a
        # value, not the one production uses.
        run: echo "APP_KEY=$(php -r 'echo bin2hex(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Tests
        run: composer unit

      - name: Migrate against the real database
        run: |
          php database/migrate.php migrate
          php database/migrate.php status
          php database/migrate.php migrate   # must be a no-op the second time

      - name: Seed the first administrator
        run: |
          php database/seed.php "CI Administrator" ci@example.test "ci-password-123"
          php database/seed.php "CI Administrator" ci@example.test "ci-password-123" --force

      - name: Dependency audit
        run: composer audit --locked --no-interaction

  # ---------------------------------------------------------------------
  # Security: dependency and secret scanning across both stacks
  # ---------------------------------------------------------------------
  security:
    name: Security — dependency scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Node dependency audit
        # Advisory, not a gate: a fresh CVE in a build tool must not stop a
        # release that ships no server-side Node. `npm audit` exits non-zero on
        # any advisory, so the trailing `|| true` is deliberate.
        run: npm ci --no-audit --no-fund && npm audit || true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # Deploy: build artifacts and publish the `deploy` branch
  # The server pulls that branch on a cron (no private key in GitHub).
  # ---------------------------------------------------------------------
  publish:
    name: Publish deploy branch
    needs: [site, admin, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build site
        run: npm ci --no-audit --no-fund && npm run build

      - name: Assemble release tree
        run: |
          mkdir -p release
          cp -a .output/public/. release/site/
          rsync -a --exclude-from=admin/.gitignore admin/ release/admin/ || cp -a admin release/admin
          rm -rf release/admin/tests release/admin/.env
          # No .gitignore in the published tree: git add (inside the publish
          # action) honours it, and `/vendor/` in it would silently drop the
          # PHPMailer build from the release.
          rm -f release/admin/.gitignore
          find release -name '.gitkeep' -delete
          echo "${{ github.sha }}" > release/RELEASE

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # PHPMailer and HTML Purifier must exist on the server: SMTP delivery and
      # the email design studio both depend on them. `vendor/` is still not
      # committed; it is built here and shipped in the release tree.
      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --working-dir=release/admin

      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./release
          publish_branch: deploy
          force_orphan: true
          commit_message: "deploy ${{ github.sha }}"
