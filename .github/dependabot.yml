# Dependency updates.
#
# The site's build toolchain and the panel's two runtime libraries are updated
# separately, because they fail differently: a broken npm package breaks the
# build (visible immediately in CI), a broken PHP library reaches the server.
#
# Majors are deliberately *not* automated. A React, Vite, TanStack, PHPUnit or
# PHPMailer major is a migration with a changelog to read, not a version bump —
# a wall of red bot pull requests trains everyone to ignore the colour.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      # One pull request for the toolchain, so a week of patch bumps is one CI
      # run rather than nine.
      build-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "composer"
    directory: "/admin"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      # The runtime libraries ship inside the release; a major there is a
      # deliberate upgrade with the panel tested against it.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
